name: Release [zipthorn]

# Tagging is the release trigger: push a v-prefixed tag and this ships the
# cross-platform binaries. Running it by hand instead builds a snapshot and
# publishes nothing, which is how to validate the pipeline without cutting a
# version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # No dependencies means no go.sum for the cache to key on.
          cache: false

      # A tag push does not trigger the CI workflow, so the same gates run here
      # rather than trusting that main was green when the tag was cut.
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  release:
    name: goreleaser
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release and upload archives
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser builds the changelog from history

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # No dependencies means no go.sum for the cache to key on.
          cache: false

      - name: Validate configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: >-
            ${{ github.event_name == 'workflow_dispatch'
            && 'release --clean --snapshot --skip=publish'
            || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A manual run publishes nothing, so keep the archives for inspection.
      - name: Upload snapshot artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: zipthorn-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
