name: CI [zipthorn]

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # zipthorn has no dependencies, so there is no go.sum
          cache: false

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  tidy:
    name: format and modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
            echo "go mod tidy changed the tree:"
            git status --porcelain
            git diff
            exit 1
          fi

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - run: go test -run=NONE -fuzz=FuzzGenerator -fuzztime=60s ./internal/generator/
      - run: go test -run=NONE -fuzz=FuzzExtractor -fuzztime=60s ./internal/extractor/

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: internal/*/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 7

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # Pinned: @latest silently changes the tool under CI, so a new release
      # can turn a green build red without anything in this repo changing.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
