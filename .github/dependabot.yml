version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # One PR for all actions rather than four
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  # zipthorn has no dependencies today and that is a feature worth keeping
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      go:
        patterns:
          - "*"
    commit-message:
      prefix: deps
