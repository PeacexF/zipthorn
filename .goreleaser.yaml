# .goreleaser.yaml
# GoReleaser configuration for zipthorn
# Build cross-platform binaries for macOS, Linux, and Windows

version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: zipthorn
    main: ./cmd/zipthorn
    binary: zipthorn
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Exclude invalid combinations
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: zipthorn
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - DISCLAIMER.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: PeacexF
    name: zipthorn
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
